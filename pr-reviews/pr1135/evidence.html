<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Import warnings evidence</title>
<style>
  body { margin: 0; font: 14px/1.4 -apple-system, Helvetica, Arial, sans-serif; background: #fff; }
  #editor { width: 1100px; height: 700px; }
  pre { margin: 8px 12px; white-space: pre-wrap; font: 13px/1.45 Menlo, monospace; }
</style>
<div id="editor"></div>
<pre id="out">running…</pre>
<script type="module">
  import { mount } from "./src/editor.js";
  import * as lib from "./src/index.js";
  const out = document.getElementById("out");
  const input = "C[C@H](O)C(=O)O |r|";
  const lines = [];
  try {
    const editor = await mount(document.getElementById("editor"));
    const result = await editor.load(input, "smiles");
    lines.push(`await editor.load(${JSON.stringify(input)}, "smiles")\n→ ${JSON.stringify(result)}`);
  } catch (error) {
    lines.push(`editor: ${error}`);
  }
  try {
    if (typeof lib.read !== "function") {
      lines.push(`import { read } from "@ameyanagi/reshiki" → ${typeof lib.read} (no such export)`);
    } else {
      const { drawing, warnings } = await lib.read(input, "smiles");
      lines.push(`await read(${JSON.stringify(input)}, "smiles")\n→ { drawing: <${drawing.length} chars rsk>, warnings: ${JSON.stringify(warnings)} }`);
    }
  } catch (error) {
    lines.push(`read: ${error}`);
  }
  out.textContent = lines.join("\n\n");
  document.title = "done";
</script>
</html>
